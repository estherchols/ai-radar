name: Weekly price check via Firecrawl
on:
  schedule:
    - cron: "17 14 * * 0"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Report changes without writing"
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Run price check
        env:
          FIRECRAWL_API_KEY: ${{ secrets.FIRECRAWL_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python update.py --dry-run; else python update.py; fi
      - name: Commit if anything moved
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "ai-radar-bot"
          git config user.email "ai-radar-bot@users.noreply.github.com"
          rm -f data.json.bak index.html.bak
          if git diff --quiet; then echo "No price changes"; exit 0; fi
          git add data.json index.html
          git commit -m "Weekly price check $(date -u +%Y-%m-%d)"
          git push

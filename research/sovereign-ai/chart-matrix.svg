<svg viewBox="0 0 720 520" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Two by two map of sovereign AI buyers">
<rect x="70" y="30" width="600" height="420" fill="none" stroke="var(--line)"/>
<line x1="370.0" y1="30" x2="370.0" y2="450" stroke="var(--line)"/><line x1="70" y1="240.0" x2="670" y2="240.0" stroke="var(--line)"/>
<text x="370.0" y="478" font-size="12" text-anchor="middle" fill="var(--dim)" font-family="Schibsted Grotesk,sans-serif">Power: time and price to energise a gigawatt  →  (fast and cheap on the right)</text>
<text transform="translate(22,240.0) rotate(-90)" font-size="12" text-anchor="middle" fill="var(--dim)" font-family="Schibsted Grotesk,sans-serif">Capital: depth of state and sovereign-wealth balance sheet  →</text>
<rect x="380.0" y="40" width="280.0" height="190.0" rx="10" fill="var(--bg)" stroke="#c4561c" stroke-width="1.5"/>
<text x="394.0" y="70" font-size="17" font-weight="700" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Compute exporters</text>
<text x="646.0" y="70" font-size="11" text-anchor="end" fill="#c4561c" font-family="IBM Plex Mono,monospace">390 MW live 2026</text>
<text x="394.0" y="90" font-size="11" fill="#c4561c" font-family="IBM Plex Mono,monospace">Saudi Arabia · UAE · Qatar</text>
<text x="394.0" y="111" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Sovereign wealth plus cheap gas and</text>
<text x="394.0" y="128" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">solar. Build beyond domestic need and</text>
<text x="394.0" y="145" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">sell capacity to foreign labs. Chips</text>
<text x="394.0" y="162" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">negotiated at head-of-state level.</text>
<text x="394.0" y="218.0" font-size="11" fill="var(--dim)" font-family="IBM Plex Mono,monospace">3,300 MW announced · $14.8B capex 2026</text>
<rect x="80" y="40" width="280.0" height="190.0" rx="10" fill="var(--bg)" stroke="#e3a248" stroke-width="1.5"/>
<text x="94" y="70" font-size="17" font-weight="700" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Industrial sovereigns</text>
<text x="346.0" y="70" font-size="11" text-anchor="end" fill="#e3a248" font-family="IBM Plex Mono,monospace">170 MW live 2026</text>
<text x="94" y="90" font-size="11" fill="#e3a248" font-family="IBM Plex Mono,monospace">Japan · South Korea · Taiwan</text>
<text x="94" y="111" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Deep corporate balance sheets,</text>
<text x="94" y="128" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">constrained grids and land. Chaebol</text>
<text x="94" y="145" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">and telco AI factories for the group's</text>
<text x="94" y="162" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">own cars, chips and robots. First in</text>
<text x="94" y="179" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">line for Rubin.</text>
<text x="94" y="218.0" font-size="11" fill="var(--dim)" font-family="IBM Plex Mono,monospace">760 MW announced · $6.5B capex 2026</text>
<rect x="80" y="250.0" width="280.0" height="190.0" rx="10" fill="var(--bg)" stroke="var(--dim)" stroke-width="1.5"/>
<text x="94" y="280.0" font-size="17" font-weight="700" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Regulated builders</text>
<text x="346.0" y="280.0" font-size="11" text-anchor="end" fill="var(--dim)" font-family="IBM Plex Mono,monospace">285 MW live 2026</text>
<text x="94" y="300.0" font-size="11" fill="var(--dim)" font-family="IBM Plex Mono,monospace">EU · France · Germany · UK</text>
<text x="94" y="321.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Budgets and development banks, slow</text>
<text x="94" y="338.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">permits and the dearest power in the</text>
<text x="94" y="355.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">set. Announce the most megawatts,</text>
<text x="94" y="372.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">energise the fewest. Research tools,</text>
<text x="94" y="389.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">not clouds.</text>
<text x="94" y="428.0" font-size="11" fill="var(--dim)" font-family="IBM Plex Mono,monospace">4,475 MW announced · $10.8B capex 2026</text>
<rect x="380.0" y="250.0" width="280.0" height="190.0" rx="10" fill="var(--bg)" stroke="var(--electric)" stroke-width="1.5"/>
<text x="394.0" y="280.0" font-size="17" font-weight="700" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Subsidised tenants</text>
<text x="646.0" y="280.0" font-size="11" text-anchor="end" fill="var(--electric)" font-family="IBM Plex Mono,monospace">280 MW live 2026</text>
<text x="394.0" y="300.0" font-size="11" fill="var(--electric)" font-family="IBM Plex Mono,monospace">India · Malaysia · Thailand · LatAm</text>
<text x="394.0" y="321.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Thin budgets, decent power. The state</text>
<text x="394.0" y="338.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">subsidises the GPU-hour and lets</text>
<text x="394.0" y="355.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">hyperscalers and neoclouds build.</text>
<text x="394.0" y="372.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">Cheapest way to put compute in</text>
<text x="394.0" y="389.0" font-size="12.5" fill="var(--ink)" font-family="Schibsted Grotesk,sans-serif">startups' hands.</text>
<text x="394.0" y="428.0" font-size="11" fill="var(--dim)" font-family="IBM Plex Mono,monospace">1,470 MW announced · $10.6B capex 2026</text>
</svg>